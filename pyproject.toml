[project]
name = "edelrep"
version = "0.1.0"
description = "Vehicle image and repair management — filesystem-first, locally hosted."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=11.0.0",
    "fsspec>=2024.0.0",
    "python-ulid>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["src/edelrep"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
    "@(abc\\.)?abstractmethod",
]
fail_under = 95

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edelrep"]
