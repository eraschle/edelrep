{% extends "base.html" %}
{% block title %}Neues Fahrzeug{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6 tracking-tight">Neues Fahrzeug anlegen</h1>
<form method="post" action="/vehicles" class="bg-white border border-stone-200 rounded-xl shadow-sm p-6 space-y-5">
  <div>
    <label for="registration_number" class="block text-sm font-medium text-stone-700 mb-1.5">Stammnummer</label>
    <input type="text" id="registration_number" name="registration_number" required
           class="w-full px-3 py-2.5 bg-white border border-stone-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#b59775] focus:border-[#b59775] transition-shadow">
    {% if errors.registration_number %}
      <p class="text-red-600 text-sm mt-1.5">{{ errors.registration_number }}</p>
    {% endif %}
  </div>
  <div>
    <label for="vin" class="block text-sm font-medium text-stone-700 mb-1.5">Rahmennummer</label>
    <input type="text" id="vin" name="vin"
           class="w-full px-3 py-2.5 bg-white border border-stone-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#b59775] focus:border-[#b59775] transition-shadow">
  </div>
  <div>
    <label for="description" class="block text-sm font-medium text-stone-700 mb-1.5">Bezeichnung</label>
    <input type="text" id="description" name="description"
           class="w-full px-3 py-2.5 bg-white border border-stone-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#b59775] focus:border-[#b59775] transition-shadow">
  </div>
  <button type="submit"
          class="bg-[#b59775] hover:bg-[#ac8a64] text-white px-6 py-2.5 rounded-lg font-medium shadow-sm transition-colors">
    Anlegen
  </button>
</form>
{% endblock %}
