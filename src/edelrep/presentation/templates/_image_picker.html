{%- from "_icons.html" import icon -%}
{% macro image_picker(name="image_picker", max_size_mb=25) %}
<div class="image-picker space-y-4"
     data-image-picker
     data-name="{{ name }}"
     data-max-size-bytes="{{ max_size_mb * 1024 * 1024 }}">

  <input type="file" multiple accept="image/*"
         data-picker-input="gallery" hidden>
  <input type="file" accept="image/*" capture="environment"
         data-picker-input="camera" hidden>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <button type="button" data-picker-trigger="camera"
            class="inline-flex items-center justify-center gap-2 bg-white hover:bg-slate-50 text-slate-900 border border-slate-300 px-4 py-3 rounded-xl font-medium shadow-sm transition-colors">
      {{ icon("camera", "w-5 h-5 text-slate-600") }} Foto aufnehmen
    </button>
    <button type="button" data-picker-trigger="gallery"
            class="inline-flex items-center justify-center gap-2 bg-white hover:bg-slate-50 text-slate-900 border border-slate-300 px-4 py-3 rounded-xl font-medium shadow-sm transition-colors">
      {{ icon("image-plus", "w-5 h-5 text-slate-600") }} Bilder auswählen
    </button>
  </div>

  <p data-picker-hint class="text-sm text-amber-700 bg-amber-50 border border-amber-200 px-3 py-2 rounded-lg" hidden></p>

  <ul data-picker-list class="space-y-2"></ul>

  <template data-picker-entry-template>
    <li class="grid grid-cols-[auto_1fr_auto] gap-x-3 gap-y-2 items-start bg-white border border-slate-200 rounded-xl p-3 shadow-sm"
        data-entry>
      <img data-entry-thumb alt=""
           class="row-span-2 h-14 w-14 object-cover rounded-lg bg-slate-100 ring-1 ring-slate-200">
      <div class="min-w-0">
        <p data-entry-filename class="font-medium text-sm truncate"></p>
        <p data-entry-meta class="text-xs text-slate-500 mt-0.5"></p>
        <p data-entry-status class="mt-1.5"></p>
      </div>
      <div class="flex items-start gap-1">
        <button type="button" data-entry-retry hidden
                class="inline-flex items-center gap-1 text-sm text-blue-600 hover:text-blue-800 font-medium transition-colors">
          {{ icon("rotate-cw", "w-4 h-4") }} Erneut
        </button>
        <button type="button" data-entry-remove
                class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-600 transition-colors"
                aria-label="Entfernen">
          {{ icon("trash", "w-4 h-4") }}
        </button>
      </div>
      <textarea data-entry-comment maxlength="1000" rows="1"
                placeholder="Kommentar (optional)"
                class="col-span-2 w-full text-sm border border-slate-200 rounded-md px-2 py-1 resize-y"></textarea>
    </li>
  </template>
</div>

<script>
(function () {
  const ICONS = {
    clock:   '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    loader:  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 animate-spin-slow"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
    check:   '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><polyline points="20 6 9 17 4 12"/></svg>',
    alert:   '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>',
  };

  document.querySelectorAll('[data-image-picker]:not([data-initialised])').forEach(initPicker);

  function initPicker(root) {
    root.dataset.initialised = '1';
    const maxSize = Number(root.dataset.maxSizeBytes);
    const galleryInput = root.querySelector('[data-picker-input="gallery"]');
    const cameraInput = root.querySelector('[data-picker-input="camera"]');
    const list = root.querySelector('[data-picker-list]');
    const tpl = root.querySelector('[data-picker-entry-template]');
    const hint = root.querySelector('[data-picker-hint]');
    const entries = [];
    let nextId = 1;
    let hintTimer = null;

    root.querySelector('[data-picker-trigger="camera"]').addEventListener('click', () => cameraInput.click());
    root.querySelector('[data-picker-trigger="gallery"]').addEventListener('click', () => galleryInput.click());
    galleryInput.addEventListener('change', () => {
      addFiles(Array.from(galleryInput.files || []));
      galleryInput.value = '';
    });
    cameraInput.addEventListener('change', () => {
      addFiles(Array.from(cameraInput.files || []));
      cameraInput.value = '';
    });

    function addFiles(files) {
      let added = false;
      for (const file of files) {
        const result = addFile(file);
        if (result === 'ok') added = true;
      }
      if (added) emitChange();
    }

    function addFile(file) {
      if (!file.type.startsWith('image/')) {
        renderInvalidEntry(file, 'Kein Bildformat');
        return 'invalid';
      }
      if (file.size > maxSize) {
        const mb = (file.size / (1024 * 1024)).toFixed(1);
        const maxMb = Math.round(maxSize / (1024 * 1024));
        renderInvalidEntry(file, `Zu gross (${mb} MB, max ${maxMb})`);
        return 'invalid';
      }
      if (entries.some(e => e.file.name === file.name && e.file.size === file.size)) {
        showHint(`"${file.name}" ist bereits ausgewählt.`);
        return 'duplicate';
      }
      const id = nextId++;
      const { li: el, thumbUrl } = renderEntry(file, id);
      const entry = { id, file, status: 'pending', el, thumbUrl,
                      statusEl: el.querySelector('[data-entry-status]'),
                      retryBtn: el.querySelector('[data-entry-retry]'),
                      commentEl: el.querySelector('[data-entry-comment]') };
      entries.push(entry);
      setStatusBadge(entry.statusEl, 'pending');
      return 'ok';
    }

    function renderEntry(file, id) {
      const li = tpl.content.firstElementChild.cloneNode(true);
      li.dataset.entryId = String(id);
      const thumbUrl = URL.createObjectURL(file);
      li.querySelector('[data-entry-thumb]').src = thumbUrl;
      li.querySelector('[data-entry-filename]').textContent = file.name;
      li.querySelector('[data-entry-meta]').textContent = formatBytes(file.size);
      li.querySelector('[data-entry-remove]').addEventListener('click', () => removeEntry(id));
      list.appendChild(li);
      return { li, thumbUrl };
    }

    function renderInvalidEntry(file, message) {
      const li = tpl.content.firstElementChild.cloneNode(true);
      const thumb = li.querySelector('[data-entry-thumb]');
      let invalidThumbUrl = null;
      if (file.type.startsWith('image/')) {
        invalidThumbUrl = URL.createObjectURL(file);
        thumb.src = invalidThumbUrl;
      } else {
        thumb.classList.add('opacity-30');
      }
      li.querySelector('[data-entry-filename]').textContent = file.name;
      li.querySelector('[data-entry-meta]').textContent = formatBytes(file.size);
      setStatusBadge(li.querySelector('[data-entry-status]'), 'error', message);
      li.querySelector('[data-entry-remove]').addEventListener('click', () => {
        if (invalidThumbUrl) URL.revokeObjectURL(invalidThumbUrl);
        li.remove();
      });
      list.appendChild(li);
    }

    function removeEntry(id) {
      const idx = entries.findIndex(e => e.id === id);
      if (idx === -1) return;
      URL.revokeObjectURL(entries[idx].thumbUrl);
      entries[idx].el.remove();
      entries.splice(idx, 1);
      emitChange();
    }

    function showHint(text) {
      if (hintTimer) clearTimeout(hintTimer);
      hint.textContent = text;
      hint.hidden = false;
      hintTimer = setTimeout(() => { hint.hidden = true; }, 3000);
    }

    function formatBytes(n) {
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / (1024 * 1024)).toFixed(1)} MB`;
    }

    function emitChange() {
      root.dispatchEvent(new CustomEvent('picker:change', {
        detail: { count: entries.length },
        bubbles: true,
      }));
    }

    function setStatusBadge(statusEl, status, message) {
      const map = {
        pending:   { iconHtml: ICONS.clock,  label: 'wartet',       cls: 'bg-slate-100 text-slate-700 ring-slate-200' },
        uploading: { iconHtml: ICONS.loader, label: 'lädt hoch…',  cls: 'bg-blue-50 text-blue-700 ring-blue-200' },
        ok:        { iconHtml: ICONS.check,  label: 'hochgeladen',  cls: 'bg-green-50 text-green-700 ring-green-200' },
        error:     { iconHtml: ICONS.alert,  label: 'Fehler',       cls: 'bg-red-50 text-red-700 ring-red-200' },
      };
      const b = map[status];
      if (!b) return;
      statusEl.className = 'inline-flex items-center gap-1.5 text-xs font-medium px-2 py-1 rounded-md ring-1 ' + b.cls;
      statusEl.innerHTML = b.iconHtml;
      const labelText = b.label + (message ? ': ' + message : '');
      statusEl.appendChild(document.createTextNode(' ' + labelText));
    }

    root.pickerApi = {
      getEntries: () => entries.map(e => ({
        id: e.id,
        file: e.file,
        status: e.status,
        commentEl: e.commentEl,
        comment: e.commentEl ? e.commentEl.value : '',
      })),
      setStatus(id, status, message) {
        const e = entries.find(x => x.id === id);
        if (!e) return;
        e.status = status;
        setStatusBadge(e.statusEl, status, message);
        e.retryBtn.hidden = (status !== 'error');
      },
      onRetry(id, handler) {
        const e = entries.find(x => x.id === id);
        if (!e) return;
        e.retryBtn.onclick = () => handler(e);
      },
    };
  }
})();
</script>
{% endmacro %}
