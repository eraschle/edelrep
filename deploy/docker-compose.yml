services:
  edelrep:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: edelrep:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    # Optional: E-Mail-Polling aktivieren
    # environment:
    #   EMAIL_PASSWORD: "..."
